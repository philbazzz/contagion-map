<title>CONTAGION Risk Universe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* CONTAGION — Institutional Risk Intelligence Terminal
   Layout: a fixed analytical frame (48px header · 252px network/scenario rail · 336px analysis rail · 56px transport)
   around a full-bleed 3D contagion map. Regions are separated by hairlines and surface tone, never by cards.
   Deliberately single-theme (dark); every colour is a token defined here. */
:root {
  --bg: #080b0f;            /* main background / map frame */
  --rail: #0d1117;          /* side rails, header, transport */
  --raise: #131922;         /* inputs, hover, popovers */
  --raise-2: #18202b;       /* pressed / selected rows */
  --line: #222b36;          /* structural hairlines */
  --line-soft: #1a212b;     /* row dividers */
  --tx: #e6ebf1;            /* primary text */
  --tx-2: #8b97a6;          /* secondary text */
  --tx-3: #596675;          /* muted labels */
  --accent: #5fc3d6;        /* interactive focus, primary action */
  --accent-ink: #062027;
  --ok: #6f9fa6;            /* normal state: low-saturation teal */
  --warn: #d6a35c;          /* warning / shock reached */
  --crit: #d96767;          /* critical loss */
  --default: #e34d59;       /* default event */
  --font-ui: "Pretendard", "Inter", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --hdr: 48px;
  --lp: 252px;
  --rp: 336px;
  --bb: 56px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--tx); font-family: var(--font-ui); font-size: 12.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; opacity: .38; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
a { color: var(--tx-2); text-decoration: none; }
a:hover { color: var(--tx); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.muted { color: var(--tx-3); }
.small { font-size: 11.5px; }
.tiny { font-size: 10.5px; }
.t-warn { color: var(--warn); }
.t-crit { color: var(--crit); }
.t-muted { color: var(--tx-3); }

/* micro label: uppercase, tracked, muted */
.lbl { margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--tx-3); display: flex; align-items: baseline; gap: 8px; }
.lbl-aside { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 10.5px; color: var(--tx-3); }

/* ---------- boot ---------- */
.boot { height: 100%; display: grid; place-content: center; gap: 6px; text-align: center; padding: 24px; color: var(--tx-2); }
.boot .wordmark { font-size: 15px; font-weight: 700; letter-spacing: .28em; color: var(--tx); }
.boot code { font-family: var(--font-num); background: var(--raise); padding: 1px 5px; }

/* ---------- frame ---------- */
.app {
  height: 100%;
  display: grid;
  grid-template-columns: var(--lp) minmax(0, 1fr) var(--rp);
  grid-template-rows: var(--hdr) minmax(0, 1fr) var(--bb);
  grid-template-areas: "hdr hdr hdr" "lp map rp" "bb bb bb";
  background: var(--bg);
}
.app.panel-closed { grid-template-columns: var(--lp) minmax(0, 1fr) 0; }
.app.panel-closed .rp { visibility: hidden; }
.hdr { grid-area: hdr; }
.lp { grid-area: lp; }
.stage-area { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.rp { grid-area: rp; }
.bb { grid-area: bb; }

/* ---------- header ---------- */
.hdr { display: flex; align-items: center; background: var(--rail); border-bottom: 1px solid var(--line); padding-right: max(10px, env(safe-area-inset-right, 0px)); min-width: 0; }
.hdr-brand { width: var(--lp); flex: none; align-self: stretch; display: flex; align-items: center; gap: 8px; padding: 0 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); }
.wm { font-size: 13px; font-weight: 700; letter-spacing: .26em; color: var(--tx); }
.wm-sub { font-size: 10.5px; color: var(--tx-3); letter-spacing: .02em; white-space: nowrap; }
.hdr-nav { display: flex; align-self: stretch; padding-left: 6px; }
.hdr-nav button { padding: 0 12px; font-size: 12px; color: var(--tx-2); border-bottom: 1px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.hdr-nav button:hover { color: var(--tx); }
.hdr-nav button.is-on { color: var(--tx); border-bottom-color: var(--tx); }
.hdr-mid { flex: 1; min-width: 0; display: flex; justify-content: flex-end; padding: 0 12px; }
.hdr > .ibtn:last-child { margin-left: auto; }
.hdr-flag { font-size: 10.5px; letter-spacing: .06em; color: var(--tx-3); border: 1px solid var(--line); padding: 2px 7px; margin-right: 8px; white-space: nowrap; cursor: help; }

/* market ticker */
.mstrip { display: flex; align-items: center; gap: 14px; height: 28px; padding: 0 10px; border: 1px solid var(--line); min-width: 0; overflow: hidden; transition: background .15s var(--ease); }
.mstrip:hover { background: var(--raise); }
.ms-lbl { font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--tx-3); }
.ms-item { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.ms-name { font-size: 11px; color: var(--tx-2); }
.ms-v { font-size: 12px; color: var(--tx); }
.ms-d { font-size: 11px; color: var(--tx-2); }
.ms-s { font-size: 11px; color: var(--tx-3); }
.ms-item.is-warn .ms-s { color: var(--warn); }

/* icon button (generic) */
.ibtn { width: 28px; height: 28px; display: inline-grid; place-items: center; color: var(--tx-2); transition: background .12s var(--ease), color .12s var(--ease); }
.ibtn:hover:not(:disabled) { background: var(--raise); color: var(--tx); }
.ibtn.is-on { color: var(--tx); }
.btn-text { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--tx-2); padding: 3px 0; justify-self: start; }
.btn-text:hover:not(:disabled) { color: var(--tx); }

/* the only emphasised action */
.btn-primary { width: 100%; height: 32px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 12.5px; border-radius: 2px; transition: filter .12s var(--ease); }
.btn-primary span { font-weight: 500; opacity: .7; font-size: 11.5px; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-primary:active:not(:disabled) { filter: brightness(.94); }
.btn-inline { width: auto; padding: 0 16px; }

/* ---------- left rail ---------- */
.lp { background: var(--rail); border-right: 1px solid var(--line); overflow-y: auto; min-height: 0; padding-left: env(safe-area-inset-left, 0px); scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.lp-sec { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.search { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 8px; background: var(--raise); border: 1px solid var(--line); color: var(--tx-3); }
.search:focus-within { border-color: var(--tx-3); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 12px; color: var(--tx); }
.search input::placeholder { color: var(--tx-3); }
.cls-list, .ent-list { list-style: none; margin: 0; padding: 0; }
.cls { width: 100%; height: 26px; display: flex; align-items: center; gap: 7px; padding: 0 2px; font-size: 12px; color: var(--tx-2); text-align: left; }
.cls:hover { color: var(--tx); }
.cls .cnt { margin-left: auto; color: var(--tx-3); font-size: 11px; }
.chev { flex: none; color: var(--tx-3); transition: transform .15s var(--ease); }
.cls.is-open .chev, .disclosure[aria-expanded="true"] .chev { transform: rotate(90deg); }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.g-ai_infra { background: #8df1ff; } .g-semiconductor { background: #b39dff; } .g-server { background: #7ee8c2; }
.g-cloud { background: #6fa8ff; } .g-financial { background: #f2c14e; } .g-demo { background: #ff7fc3; }
.ent-list { margin: 2px 0 6px 18px; border-left: 1px solid var(--line-soft); }
.ent { width: 100%; height: 24px; display: grid; grid-template-columns: 6px minmax(0, 1fr) auto 6px; align-items: center; gap: 7px; padding: 0 6px 0 8px; font-size: 12px; color: var(--tx); text-align: left; }
.ent:hover { background: var(--raise); }
.ent.is-on { background: var(--raise-2); box-shadow: inset 2px 0 0 var(--accent); }
.ent-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ent-tk { font-size: 10.5px; color: var(--tx-3); }
.sdot { width: 6px; height: 6px; border-radius: 50%; }
.s-crit { background: var(--default); } .s-warn { background: var(--warn); }
.s-warn-o { border: 1px solid var(--warn); } .s-muted-o { border: 1px dashed var(--tx-3); }

.f-row { display: grid; gap: 4px; }
.f-lbl { font-size: 11px; color: var(--tx-2); display: flex; align-items: center; gap: 5px; }
.lp select, .modal select { width: 100%; height: 28px; padding: 0 8px; background: var(--raise); border: 1px solid var(--line); border-radius: 0; font-size: 12px; color: var(--tx); }
.lp select:hover, .modal select:hover { border-color: #2c3744; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); background: var(--bg); }
.seg button { height: 26px; font-size: 11.5px; color: var(--tx-2); border-left: 1px solid var(--line); white-space: nowrap; transition: background .12s var(--ease), color .12s var(--ease); }
.seg button:first-child { border-left: 0; }
.seg button:hover { color: var(--tx); background: var(--raise); }
.seg button.is-on { background: var(--raise-2); color: var(--tx); box-shadow: inset 0 -1px 0 var(--accent); }
.seg button.is-off { color: var(--tx-3); text-decoration: line-through; text-decoration-color: var(--tx-3); }
.seg-sm { width: 100px; }
.seg-sm button { height: 22px; font-size: 11px; }
.f-row:has(.seg-sm) { grid-template-columns: 1fr auto; align-items: center; }
.tip-i { display: inline-grid; color: var(--tx-3); cursor: help; }
.tip-i:hover { color: var(--tx-2); }
.note { margin: 0; font-size: 11px; color: var(--tx-3); line-height: 1.4; }
.note.warn { color: var(--warn); }
.note.crit { color: var(--crit); }

.as-list { border-top: 1px solid var(--line-soft); }
.as-row { border-bottom: 1px solid var(--line-soft); }
.as-head { width: 100%; height: 28px; display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 5px; text-align: left; font-size: 12px; color: var(--tx-2); }
.as-head:hover { color: var(--tx); }
.as-label em { font-style: normal; font-size: 10px; color: var(--tx-3); margin-left: 5px; }
.as-val { justify-self: end; color: var(--tx); font-size: 12.5px; }
.as-row.is-open .as-val { color: var(--accent); }
.as-edit { padding: 2px 0 8px; display: grid; gap: 4px; }
.as-edit p { margin: 0; font-size: 10.5px; color: var(--tx-3); }
.as-edit input[type="number"] { height: 26px; padding: 0 6px; background: var(--raise); border: 1px solid var(--line); font-family: var(--font-num); font-size: 12px; text-align: right; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; background: transparent; --fill: 50%; }
input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(90deg, var(--tx-2) var(--fill), var(--line) var(--fill)); }
input[type="range"]::-moz-range-track { height: 2px; background: linear-gradient(90deg, var(--tx-2) var(--fill), var(--line) var(--fill)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4px; border-radius: 50%; background: var(--tx); border: 0; }
input[type="range"]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--tx); border: 0; }
.lp-run { gap: 8px; }
.summary { margin: 0; font-size: 11.5px; color: var(--tx-2); line-height: 1.5; }
.disclosure { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--tx-2); padding: 2px 0; text-align: left; }
.disclosure:hover { color: var(--tx); }
.guide { display: grid; gap: 6px; font-size: 11.5px; color: var(--tx-2); animation: fade .18s var(--ease); }
.guide p { margin: 0; }
.guide b { color: var(--tx); font-weight: 600; margin-right: 4px; }
.guide dl { margin: 4px 0 0; display: grid; gap: 4px; }
.guide dt { color: var(--tx); font-weight: 600; font-size: 11.5px; }
.guide dd { margin: 0; color: var(--tx-3); }

/* ---------- right rail ---------- */
.rp { background: var(--rail); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
.rp-bar { height: 34px; flex: none; display: flex; align-items: center; padding: 0 6px 0 14px; border-bottom: 1px solid var(--line); }
.rp-bar-actions { margin-left: auto; display: flex; }
.rp-scroll { overflow-y: auto; min-height: 0; flex: 1; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.rp-body { animation: fade .18s var(--ease); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.ent-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
.ent-head h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; color: var(--tx); line-height: 1.25; text-wrap: balance; }
.ent-head .lbl { margin-bottom: 4px; }
.ent-sub { margin: 0; font-size: 11.5px; color: var(--tx-2); }
.ent-sector { margin: 2px 0 0; font-size: 11.5px; color: var(--tx-3); }
.ent-status { margin: 8px 0 0; font-size: 11.5px; color: var(--tx-2); display: flex; align-items: center; gap: 6px; }
.ent-status i { width: 6px; height: 6px; border-radius: 50%; background: var(--tx-3); flex: none; }
.ent-status.st-reached { color: var(--warn); } .ent-status.st-reached i { background: var(--warn); }
.ent-status.st-origin i { background: var(--default); }
.ent-status.st-no_data { color: var(--warn); } .ent-status.st-no_data i { background: transparent; border: 1px solid var(--warn); }
.ent-status.st-pending i { background: transparent; border: 1px dashed var(--tx-3); }
.arr { color: var(--tx-3); margin: 0 5px; font-weight: 400; }
.edge-h { display: flex; flex-wrap: wrap; align-items: baseline; }
.rp-sec { padding: 11px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 7px; min-width: 0; }
.rp-sec dl { margin: 0; display: grid; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 3px 0; border-bottom: 1px solid var(--line-soft); }
.kv:last-child { border-bottom: 0; }
.kv dt { font-size: 11.5px; color: var(--tx-3); }
.kv dd { margin: 0; font-size: 12px; color: var(--tx); text-align: right; overflow-wrap: anywhere; }
.pathline { margin: 0; font-size: 12px; line-height: 1.6; }
.link { color: var(--tx); border-bottom: 1px dotted var(--tx-3); }
.link:hover { border-bottom-color: var(--tx); }
.muted-line { margin: 0; font-size: 11.5px; color: var(--tx-3); }
.drivers { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.drivers li { display: grid; grid-template-columns: 22px minmax(0, 1fr); font-size: 12px; color: var(--tx); }
.drivers li span { color: var(--tx-3); font-size: 11px; }
.srcs, .assm, .log, .evid { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.srcs a { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; }
.assm li, .log li { font-size: 11.5px; color: var(--tx-2); padding-left: 10px; position: relative; }
.assm li::before, .log li::before { content: ""; position: absolute; left: 0; top: .7em; width: 4px; height: 1px; background: var(--tx-3); }
.log li { color: var(--tx); }
.disc-body { padding-top: 6px; display: grid; gap: 6px; animation: fade .18s var(--ease); }
.prose { margin: 0; font-size: 11.5px; color: var(--tx-2); line-height: 1.55; }
.fine { margin: 0; font-size: 10.5px; color: var(--tx-3); line-height: 1.45; }
.fine.warn { color: var(--warn); }
.story { display: grid; gap: 4px; }
.story h5 { margin: 6px 0 0; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; color: var(--tx-3); }
.story p { margin: 0; font-size: 11.5px; color: var(--tx-2); line-height: 1.55; }
.paths { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.path { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 4px 6px; font-size: 11.5px; color: var(--tx-2); text-align: left; border-left: 2px solid transparent; }
.path:hover { background: var(--raise); }
.path.is-on { color: var(--tx); border-left-color: var(--accent); background: var(--raise); }
.path.is-future { color: var(--tx-3); }
table.calc { width: 100%; border-collapse: collapse; font-size: 11px; }
table.calc td { padding: 3px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; color: var(--tx-2); }
table.calc td.num { text-align: right; color: var(--tx); padding-left: 8px; }
.evid li { display: grid; font-size: 11.5px; color: var(--tx-2); }
.evid .tags { font-size: 10.5px; color: var(--tx-3); }

.tbl { width: 100%; border-collapse: collapse; font-size: 11.5px; table-layout: fixed; }
.tbl th { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tx-3); text-align: left; padding: 4px 0; border-bottom: 1px solid var(--line); }
.tbl td { padding: 4px 0; border-bottom: 1px solid var(--line-soft); color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl .r { text-align: right; }
.tbl th:first-child, .tbl td:first-child { width: 42%; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--raise); }
.tbl tfoot td { color: var(--tx-2); border-bottom: 0; padding-top: 6px; }
.cmp tbody tr { cursor: default; }
.cmp tbody tr:hover td { background: none; }
.cmp td:first-child { color: var(--tx-3); }
.cmp tr.diff td { color: var(--warn); }
.cmp tr.out td { font-weight: 600; }

/* ---------- map ---------- */
.map { position: absolute; inset: 0; }
.map.is-hidden { visibility: hidden; }
.map-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.map-canvas:active { cursor: grabbing; }
.readout { position: absolute; left: 12px; top: 12px; max-width: min(460px, calc(100% - 80px)); padding: 7px 10px; background: rgba(8, 11, 15, .72); border-left: 2px solid var(--line); pointer-events: none; }
.readout.tone-red { border-left-color: var(--default); }
.readout.tone-orange { border-left-color: var(--warn); }
.readout.tone-violet { border-left-color: #9b86c9; }
.ro-k { margin: 0; font-family: var(--font-num); font-size: 10.5px; letter-spacing: .06em; color: var(--tx-3); }
.ro-t { margin: 1px 0 0; font-size: 12.5px; font-weight: 600; color: var(--tx); }
.readout ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 1px; }
.readout li { font-size: 11.5px; color: var(--tx-2); overflow-wrap: anywhere; }
.ro-more { margin: 2px 0 0; font-size: 10.5px; color: var(--tx-3); }
.map-tools { position: absolute; right: 10px; top: 12px; display: flex; flex-direction: column; background: rgba(13, 17, 23, .86); border: 1px solid var(--line); }
.mt { width: 30px; height: 30px; display: grid; place-items: center; color: var(--tx-2); transition: background .12s var(--ease), color .12s var(--ease); }
.mt:hover:not(:disabled) { background: var(--raise); color: var(--tx); }
.mt.is-on { color: var(--accent); }
.mt-sep { height: 1px; background: var(--line); }
.pop { position: absolute; right: 48px; top: 12px; width: 230px; padding: 10px 12px; background: var(--rail); border: 1px solid var(--line); display: grid; gap: 6px; animation: fade .15s var(--ease); z-index: 4; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--tx-2); cursor: pointer; }
.chk input { accent-color: var(--accent); margin: 0; }
.chk i { width: 10px; height: 2px; flex: none; }
.chk i.dash { background: repeating-linear-gradient(90deg, #ff7fc3 0 3px, transparent 3px 5px); }
.lg { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size: 11.5px; color: var(--tx-2); }
.lg li { display: flex; align-items: center; gap: 6px; }
.lg i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.lg.lines { grid-template-columns: 1fr; }
.ln { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--warn); }
.ln.dash { border-top: 1px dashed var(--tx-3); }
.map-hint { position: absolute; left: 12px; bottom: 8px; margin: 0; font-size: 10.5px; color: var(--tx-3); pointer-events: none; }

.hc-s.st-impacted, .hc-s.st-flagged, .hc-s.st-demand_shock, .hc-s.st-shock_origin, .hc-s.st-operational_impact, .hc-s.st-service_origin { color: var(--warn); }

/* ---------- transport / timeline / KPI strip ---------- */
.bb { display: grid; grid-template-columns: auto minmax(160px, 1fr) auto; align-items: center; background: var(--rail); border-top: 1px solid var(--line); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); min-width: 0; }

.speed { height: 24px; margin: 0 4px; padding: 0 4px; background: var(--raise); border: 1px solid var(--line); font-size: 11px; color: var(--tx-2); }
.bb-timeline { padding: 0 16px; display: grid; gap: 3px; min-width: 0; }
.bb-timeline input[type="range"]::-webkit-slider-runnable-track { background: linear-gradient(90deg, var(--accent) var(--fill), var(--line) var(--fill)); }
.bb-timeline input[type="range"]::-moz-range-track { background: linear-gradient(90deg, var(--accent) var(--fill), var(--line) var(--fill)); }
.ticks { display: flex; justify-content: space-between; }
.ticks button { font-family: var(--font-num); font-size: 10px; color: var(--tx-3); }
.ticks button.is-past { color: var(--tx-2); }
.ticks button.is-cur { color: var(--tx); }
.kpi-strip { margin: 0; display: flex; align-self: stretch; border-left: 1px solid var(--line); }
.kpi { display: grid; align-content: center; gap: 1px; padding: 0 14px; border-right: 1px solid var(--line-soft); min-width: 76px; text-align: right; cursor: help; }
.kpi:last-child { border-right: 0; }
.kpi dt { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--tx-3); white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.kpi dd { margin: 0; font-size: 14px; color: var(--tx); white-space: nowrap; }

/* ---------- tooltip / toast ---------- */
.gtip { position: fixed; z-index: 50; max-width: 280px; transform: translate(-50%, -100%); padding: 6px 8px; background: #1b232e; border: 1px solid #2b3543; color: var(--tx); font-size: 11.5px; line-height: 1.45; pointer-events: none; animation: fade .12s var(--ease); }
.gtip.below { transform: translate(-50%, 0); }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6; padding: 6px 12px; background: var(--rail); border: 1px solid var(--line); font-size: 12px; color: var(--tx); animation: fade .15s var(--ease); }

/* ---------- market modal ---------- */
.modal-back { position: fixed; inset: 0; z-index: 30; background: rgba(4, 6, 9, .7); display: grid; place-items: start center; overflow-y: auto; padding-block: 56px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); animation: fade .18s var(--ease); }
.modal { position: relative; width: min(940px, 100%); background: var(--rail); border: 1px solid var(--line); display: grid; }
.modal-x { position: absolute; right: 6px; top: 6px; }
.modal-h { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; justify-items: start; }
.modal-h h2 { margin: 0; font-size: 16px; font-weight: 600; }
.modal-h p { margin: 0; font-size: 11.5px; color: var(--tx-2); max-width: 75ch; }
.mk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.mk-ind { padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }

.mk-main { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

.mk-main span { font-size: 11px; color: var(--tx-3); }
.mk-main b.mk-none { font-size: 12.5px; font-family: var(--font-ui); font-weight: 500; color: var(--warn); }
.obs-tag, .tag-assume { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border: 1px solid; }
.obs-tag { color: var(--ok); border-color: rgba(111, 159, 166, .5); }
.tag-assume { color: var(--warn); border-color: rgba(214, 163, 92, .5); }
.mk-kv { margin: 0; display: grid; grid-template-columns: 112px minmax(0, 1fr); font-size: 11.5px; }
.mk-kv dt { color: var(--tx-3); padding: 3px 0; border-bottom: 1px solid var(--line-soft); }
.mk-kv dd { margin: 0; padding: 3px 0; border-bottom: 1px solid var(--line-soft); text-align: right; overflow-wrap: anywhere; }
.amber { color: var(--warn); }
.hint { margin: 0; font-size: 11px; color: var(--tx-3); line-height: 1.45; }
.hint.caution { color: var(--warn); }
.mk-scn { padding: 14px 16px; display: grid; gap: 10px; justify-items: start; }

.col-obs, .col-assume { padding: 12px; display: grid; gap: 8px; align-content: start; justify-items: start; min-width: 0; }
.col-assume { border-left: 1px solid var(--line); }

.col-assume select, .col-assume .field { width: 100%; }
.field { display: grid; gap: 4px; }
.field-head { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--tx-2); }
.field-head output { font-family: var(--font-num); color: var(--tx); }

/* ---------- data sources ---------- */
.sources-view { position: absolute; inset: 0; overflow-y: auto; padding: 16px 20px 32px; display: grid; gap: 16px; align-content: start; background: var(--bg); z-index: 3; }
.sv-head h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }

.sv-table td a { color: var(--tx); }
.linkish { color: var(--tx); border-bottom: 1px dotted var(--tx-3); }
.assume-tag { font-style: normal; font-size: 10px; color: var(--warn); margin-left: 3px; }


/* ---------- v0.4: refinancing · relationship universe ---------- */

.st-tag { display: inline-block; margin-left: 6px; padding: 0 4px; font-family: var(--font-num); font-size: 9.5px; letter-spacing: .04em; line-height: 15px; border: 1px solid var(--line); color: var(--tx-3); vertical-align: 1px; white-space: nowrap; cursor: help; }

.st-tag.st-UNKNOWN { color: var(--tx-3); border-style: dotted; }

/* header dataset counts */

.hdr-stats dd { margin: 0; font-size: 13px; color: var(--tx); line-height: 1.2; }

/* scenario form */
.facts { margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line-soft); }
.facts div { padding: 5px 7px; display: grid; gap: 1px; min-width: 0; }
.facts div + div { border-left: 1px solid var(--line-soft); }

.facts .st-tag { margin-left: 3px; }
.rate-pick { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.numf { display: inline-flex; align-items: center; height: 26px; background: var(--raise); border: 1px solid var(--line); }
.numf:focus-within { border-color: var(--tx-3); }
.numf input { flex: 1; min-width: 0; width: 100%; height: 100%; border: 0; background: transparent; outline: none; padding: 0 4px 0 6px; font-family: var(--font-num); font-size: 12px; text-align: right; color: var(--tx); -moz-appearance: textfield; }

.numf input::placeholder { color: var(--tx-3); }
.numf i { font-style: normal; font-size: 10.5px; color: var(--tx-3); padding-right: 6px; }
.kvlist { border-top: 1px solid var(--line-soft); }
.kvrow { min-height: 32px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px; border-bottom: 1px solid var(--line-soft); padding: 3px 0; }
.kvrow-l { font-size: 11.5px; color: var(--tx-2); display: flex; align-items: center; gap: 4px; min-width: 0; }
.kvrow-v { display: flex; align-items: center; justify-content: flex-end; }

.kvrow .seg-sm { width: 84px; }
input.month { height: 26px; width: 112px; padding: 0 6px; background: var(--raise); border: 1px solid var(--line); font-family: var(--font-num); font-size: 11.5px; color: var(--tx); color-scheme: dark; }
.kvlist.adv { border-top: 0; }
.cls { gap: 6px; }
.cls input { margin: 0; accent-color: var(--accent); flex: none; }
.cls-b { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; height: 26px; font-size: 12px; color: var(--tx-2); text-align: left; }

.cls-b .cnt { margin-left: auto; color: var(--tx-3); font-size: 11px; }
.cls.is-open .cls-b .chev { transform: rotate(90deg); }
.s-gold-o { border: 1px solid #f2c14e; }
.g-customer { background: #6fa8ff; } .g-datacenter { background: #86e3a6; }

/* right rail: relationships, contracts, paths */
.lbl.sub { margin-top: 4px; }
.arr-inf { opacity: .55; }
.link-row, .ctr-row { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 8px; padding: 5px 6px; margin: 0 -6px; width: calc(100% + 12px); text-align: left; border-bottom: 1px solid var(--line-soft); }
.link-row:hover, .ctr-row:hover { background: var(--raise); }

.lr-m, .ctr-row em { grid-column: 1 / -1; font-style: normal; font-size: 10.5px; color: var(--tx-3); }
.lr-v, .ctr-row .num { grid-row: 1; grid-column: 2; font-size: 11.5px; color: var(--tx-2); text-align: right; }
.ctr-list { display: grid; }
.pathfind { display: grid; gap: 4px; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line-soft); }
.pathfind select { width: 100%; height: 26px; padding: 0 6px; background: var(--raise); border: 1px solid var(--line); font-size: 11.5px; color: var(--tx); }
.cat { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-size: 12px; color: var(--tx); }
.cat b { display: inline-grid; place-items: center; width: 16px; height: 16px; font-family: var(--font-num); font-size: 10px; border: 1px solid var(--line); color: var(--tx-2); }
.cat-computed b { color: var(--accent); border-color: rgba(95, 195, 214, .5); }
.cat-assumed b { color: var(--warn); border-color: rgba(214, 163, 92, .5); }
.cat-relationship_only b { border-style: dashed; }
.cat-unconfirmed b { border-style: dotted; color: var(--tx-3); }
.catrow { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--line-soft); }
.catrow .num { font-size: 12px; color: var(--tx-2); }
.srcs li { display: grid; gap: 0; }
.src-m { font-size: 10.5px; color: var(--tx-3); }
.ptbl td.wrap { white-space: normal; color: var(--tx-2); font-size: 11px; }
.ptbl th:first-child, .ptbl td:first-child { width: 36%; }

.mat { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }

.ln.solid { border-top: 2px solid var(--tx-2); }
.hc-s.st-shock_origin, .hc-s.st-assumed { color: var(--warn); }
.hc-s.st-contract_party { color: #f2c14e; }

.ticks .tk-l { color: var(--tx-3); font-family: var(--font-ui); }

.sv-h-sub { margin-top: 14px !important; }
.sv-status { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi dd { font-size: 13.5px; }


/* ---------- v0.5: modes · market · contract ledger · flow views ---------- */
.mode-seg { display: inline-flex; align-self: center; height: 28px; border: 1px solid var(--line); margin-right: 6px; }
.mode-seg button { padding: 0 12px; height: 100%; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tx-3); border-left: 1px solid var(--line); border-bottom: 0 !important; margin: 0 !important; }
.mode-seg button:first-child { border-left: 0; }
.mode-seg button:hover { color: var(--tx); background: var(--raise); }
.mode-seg button.is-on { color: var(--tx); background: var(--raise-2); box-shadow: inset 0 -2px 0 var(--accent); }
.mode-seg .mode-market.is-on { box-shadow: inset 0 -2px 0 #f0605d; }

.hdr-nav { align-items: center; }

.is-up { color: #f0605d !important; }
.is-down { color: #4d8df5 !important; }

/* quote block */
.quote { display: grid; gap: 1px; padding: 2px 0 4px; }
.q-krw { margin: 0; font-size: 21px; font-weight: 500; color: var(--tx); letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; }

.q-loc { margin: 0; font-size: 12.5px; color: var(--tx-2); }
.chart-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
.seg-xs { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--line); }
.seg-xs button { height: 20px; padding: 0 7px; font-family: var(--font-num); font-size: 10px; color: var(--tx-3); border-left: 1px solid var(--line); }

.seg-xs button.is-on { color: var(--tx); background: var(--raise-2); }
.qtbl td b { font-weight: 500; }
.qtbl th:first-child, .qtbl td:first-child { width: 38%; }

/* svg views */
.viz { display: block; overflow: visible; font-family: var(--font-ui); }

.pf-l { stroke: var(--tx-2); stroke-width: 1.2; }

.pf-lbl { fill: var(--tx) !important; font-size: 11px !important; }
.pf-sub { fill: var(--tx-3) !important; font-family: var(--font-num); font-size: 9.5px !important; }

.pathflow { margin: 2px 0 6px; }

.tl { display: grid; gap: 4px; margin: 2px 0 6px; }
.tl-grid { stroke: var(--line-soft); stroke-width: 1; }

.tl-lbl { fill: var(--tx) !important; font-size: 11px !important; }
.tl-amt { fill: var(--tx-2) !important; font-family: var(--font-num); font-size: 10.5px !important; }
.tl-rem { fill: var(--tx-3) !important; font-size: 9.5px !important; }
.tl-bar { fill: #8b97a6; }
.tl-bar.open { fill: transparent; stroke: #8b97a6; stroke-dasharray: 3 2; }
.tone-debt .tl-bar { fill: #d6a35c; } .tone-debt .tl-bar.open { fill: transparent; stroke: #d6a35c; }
.tone-customer .tl-bar { fill: #6fa8ff; } .tone-customer .tl-bar.open { fill: transparent; stroke: #6fa8ff; }
.tone-lease .tl-bar { fill: #86e3a6; } .tone-lease .tl-bar.open { fill: transparent; stroke: #86e3a6; }

.pricechart .pc-line { fill: none; stroke-width: 1.5; }

.pc-ax { fill: var(--tx-3) !important; font-family: var(--font-num); font-size: 9.5px !important; }

.big-num { margin: 0; font-size: 18px; color: var(--tx); }
.sharebar { display: grid; gap: 6px; }
.sb-track { display: flex; height: 8px; background: var(--raise); }

.sb-0 { background: #d6a35c; } .sb-1 { background: #a57e48; } .sb-2 { background: #6e5634; }
.sb-legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.sb-legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 6px; align-items: center; font-size: 11px; color: var(--tx-2); }
.sb-legend li.is-on { color: var(--tx); }
.sb-legend b { width: 8px; height: 8px; display: block; }
.sb-legend .num { color: var(--tx); }

.cc { padding: 6px 0 4px; border-top: 1px solid var(--line-soft); }
