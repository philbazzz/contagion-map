# Refreshes redistributable FRED UST yields into frontend/public/data/market.json.
# Does NOT fetch equity quotes (Finnhub / Yahoo redistribution not permitted for public Pages).
name: Refresh FRED market snapshot

on:
  schedule:
    - cron: "30 21 * * 1-5"  # ~06:30 KST next morning · US close + FRED lag
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fred:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch FRED UST 10Y / 2Y
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "::warning::FRED_API_KEY secret is not set. Add it under Settings → Secrets."
            exit 0
          fi
          mkdir -p frontend/public/data
          python scripts/fetch_fred_public.py --out frontend/public/data/market.json

      - name: Commit snapshot
        run: |
          if [ ! -f frontend/public/data/market.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/market.json
          if git diff --staged --quiet; then
            echo "No market.json changes"
          else
            git commit -m "chore: refresh FRED UST yield snapshot"
            git push
          fi
