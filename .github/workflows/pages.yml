name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps (network export only)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare static data (network + observed quotes via yfinance/FDR)
        working-directory: frontend
        env:
          FETCH_QUOTES: "1"
        run: npm ci && npm run prepare:static

      - name: Refresh FRED market snapshot (optional)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -n "$FRED_API_KEY" ]; then
            python scripts/fetch_fred_public.py --out frontend/public/data/market.json
          else
            echo "FRED_API_KEY secret not set — keeping placeholder market.json"
          fi

      - name: Build
        working-directory: frontend
        env:
          # Project Pages: /<repo>/  — override via repository variable VITE_BASE if needed
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_MODE: static
        run: npx vite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
