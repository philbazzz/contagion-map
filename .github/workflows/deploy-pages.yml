# main에 frontend 변경이 올라오면 GitHub Pages(gh-pages 브랜치)를 자동으로 다시 빌드·배포합니다.
# public/data의 JSON(시세 스냅샷 등)은 커밋된 그대로 사용합니다(prepare:static 재실행 안 함).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: /contagion-map/
        run: |
          npx vite build
          cp dist/index.html dist/404.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          commit_message: "Deploy Pages from ${{ github.sha }}"
